---
name: Run Molecule

on:
  workflow_call:
    inputs:
      distros:
        required: false
        type: string
        default: |
          [
            "debian13",
            "debian12",
            "fedora43",
            "fedora44",
            "ubuntu2604",
            "ubuntu2404",
            "ubuntu2204",
            "rockylinux9",
            "rockylinux10"
          ]

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ansible-lint
        uses: ansible/ansible-lint@b74fb6f73d234bf92672372cb1c10768e4018d16 # v26.11.0
  test:
    needs:
      - lint
    runs-on: ubuntu-latest
    container:
      image: python:3.13  # can't go to 3.14+ until ansible 13
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(inputs.distros) }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "${{ github.repository }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ github.repository }}/requirements.txt

      - name: Run molecule
        uses: gofrolist/molecule-action@28a1b203fec189866f78b783bf8f50f8e742c65f # v2.9.16
        with:
          molecule_command: test
        env:
          image: ${{ matrix.distro }}
