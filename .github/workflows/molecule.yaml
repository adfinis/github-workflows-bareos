---
name: Run Molecule

on:
  workflow_call:
    inputs:
      distros:
        required: false
        type: string
        default: |
          [
            "debian13",
            "debian12",
            "debian11",
            "fedora42",
            "ubuntu2404",
            "ubuntu2204",
            "rockylinux9",
            "rockylinux10"
          ]

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Run ansible-lint
        uses: ansible/ansible-lint@5fac056c45595896c973fbde871f01f6cb14d74c # v26.4.0
  test:
    needs:
      - lint
    runs-on: ubuntu-latest
    container:
      image: python:3.13  # can't go to 3.14+ until ansible 13
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(inputs.distros) }}
    steps:
      - name: checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: "${{ github.repository }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ github.repository }}/requirements.txt

      - name: Run molecule
        uses: gofrolist/molecule-action@7d3863c6c3f2a608bcff566b65ebfc831319a136 # v2.7.100
        with:
          molecule_command: test
        env:
          image: ${{ matrix.distro }}
