---
name: Run Molecule

on:
  workflow_call:
    inputs:
      distros:
        required: false
        type: string
        default: |
          [
            "debian13",
            "debian12",
            "debian11",
            "fedora43",
            "fedora44",
            "ubuntu2604",
            "ubuntu2404",
            "ubuntu2204",
            "rockylinux9",
            "rockylinux10"
          ]

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run ansible-lint
        uses: ansible/ansible-lint@262624cd0ab22a4221293216856c59671ce7aa5e # v26.6.0
  test:
    needs:
      - lint
    runs-on: ubuntu-latest
    container:
      image: python:3.13  # can't go to 3.14+ until ansible 13
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(inputs.distros) }}
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: "${{ github.repository }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ github.repository }}/requirements.txt

      - name: Run molecule
        uses: gofrolist/molecule-action@c7c34fe77f6696569ef59a74a371db6765dfd18f # v2.7.102
        with:
          molecule_command: test
        env:
          image: ${{ matrix.distro }}
